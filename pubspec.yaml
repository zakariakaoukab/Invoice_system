name: darbelamri_invoices
description: "Point of Sale, Inventory Management, Analytics & Invoicing system for Dar Belamri."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.7

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Charts & Visuals
  fl_chart: ^0.70.2

  # Internationalization & Date Formatting
  intl: ^0.20.2

  # File Picking (Desktop-friendly)
  file_picker: ^8.1.2

  # Image loading from network
  cached_network_image: ^3.4.1

  # Icons
  flutter_svg: ^2.0.10+1

  # Utils
  uuid: ^4.5.1
  equatable: ^2.0.7
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - .env

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
